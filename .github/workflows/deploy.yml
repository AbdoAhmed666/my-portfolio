# Publishes abdoahmed666.github.io/my-portfolio from the
# AI_Engineer_Universe source.
#
# This address is the one in the CV, so it keeps working and now shows the
# current site. The repository's previous Vite source is left where it is on
# main; only the published branch changes.
#
# Publishes by committing to gh-pages rather than through actions/deploy-pages.
# Pages here has always been served from that branch, and the github-pages
# environment is restricted to it — a deployment from main is rejected by
# environment protection before it runs. Pushing a branch is not a deployment,
# so it is not subject to that rule, and it is what this repository's Pages
# setup already reads.
name: Deploy portfolio

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of AI_Engineer_Universe to publish
        required: false
        default: main
  # A safety net, so a forgotten manual run is at most a day stale.
  schedule:
    - cron: "0 5 * * *"
  # Lets the source repository trigger this once a token is configured.
  repository_dispatch:
    types: [source-updated]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site source
        uses: actions/checkout@v4
        with:
          repository: AbdoAhmed666/AI_Engineer_Universe
          ref: ${{ github.event.inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, so the build has to be told
      # its prefix — without it the page loads its HTML and none of its
      # JavaScript — and its own origin, so the share card resolves.
      - name: Build the static export
        run: STATIC_EXPORT=1 npm run build
        env:
          BASE_PATH: /my-portfolio
          NEXT_PUBLIC_SITE_URL: https://abdoahmed666.github.io/my-portfolio

      # The share card exports as an extensionless file, which a static host
      # serves as application/octet-stream — and link scrapers reject that, so
      # the preview silently shows nothing. Copy it to a .png that gets the
      # right type, point the tags at the copy, and leave the original in
      # place so neither URL 404s.
      - name: Give the share card a servable extension
        run: |
          cp out/opengraph-image out/opengraph-image.png
          cp out/twitter-image  out/twitter-image.png
          sed -i 's#/opengraph-image?#/opengraph-image.png?#g; s#/twitter-image?#/twitter-image.png?#g' out/*.html

      # Jekyll would drop every `_next/` asset, and a branch-served Pages
      # site does run it.
      - run: touch out/.nojekyll

      # Committed on top of the existing gh-pages history rather than
      # force-pushed, so any published build is one revert away.
      - name: Publish to gh-pages
        working-directory: out
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin gh-pages
          git reset -q --soft FETCH_HEAD
          git add -A
          git diff --quiet --cached && echo "nothing changed" && exit 0
          git commit -qm "Publish ${{ github.sha }}"
          git push origin HEAD:gh-pages
